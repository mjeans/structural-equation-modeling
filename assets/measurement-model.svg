<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Three-factor confirmatory factor analysis</title>
  <desc id="desc">Support, engagement, and academic confidence are each measured by multiple survey indicators.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="60" y="58" fill="#0f172a" font-family="Arial, sans-serif" font-size="31" font-weight="700">Prespecified measurement model</text>
  <text x="60" y="92" fill="#475569" font-family="Arial, sans-serif" font-size="18">Eleven continuous indicators define three correlated latent constructs.</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <ellipse cx="200" cy="205" rx="120" ry="54" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="200" y="212" fill="#1e3a8a" font-size="23" font-weight="700">Support</text>

    <ellipse cx="600" cy="205" rx="120" ry="54" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="600" y="212" fill="#14532d" font-size="23" font-weight="700">Engagement</text>

    <ellipse cx="1000" cy="205" rx="132" ry="54" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <text x="1000" y="199" fill="#4c1d95" font-size="21" font-weight="700">Academic</text>
    <text x="1000" y="225" fill="#4c1d95" font-size="21" font-weight="700">confidence</text>

    <path d="M320 195 Q400 145 480 195" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M720 195 Q800 145 868 195" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M300 167 Q600 45 900 167" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>

    <g fill="#ffffff" stroke="#93c5fd" stroke-width="2">
      <rect x="70" y="350" width="118" height="58" rx="12"/><rect x="202" y="350" width="118" height="58" rx="12"/>
      <rect x="70" y="430" width="118" height="58" rx="12"/><rect x="202" y="430" width="118" height="58" rx="12"/>
    </g>
    <g fill="#1e3a8a" font-size="16"><text x="129" y="385">support_1</text><text x="261" y="385">support_2</text><text x="129" y="465">support_3</text><text x="261" y="465">support_4</text></g>

    <g fill="#ffffff" stroke="#86efac" stroke-width="2">
      <rect x="470" y="350" width="118" height="58" rx="12"/><rect x="602" y="350" width="118" height="58" rx="12"/>
      <rect x="470" y="430" width="118" height="58" rx="12"/><rect x="602" y="430" width="118" height="58" rx="12"/>
    </g>
    <g fill="#14532d" font-size="15"><text x="529" y="385">engagement_1</text><text x="661" y="385">engagement_2</text><text x="529" y="465">engagement_3</text><text x="661" y="465">engagement_4</text></g>

    <g fill="#ffffff" stroke="#c4b5fd" stroke-width="2">
      <rect x="858" y="350" width="125" height="58" rx="12"/><rect x="997" y="350" width="125" height="58" rx="12"/>
      <rect x="927" y="430" width="125" height="58" rx="12"/>
    </g>
    <g fill="#4c1d95" font-size="15"><text x="920" y="385">confidence_1</text><text x="1059" y="385">confidence_2</text><text x="989" y="465">confidence_3</text></g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M160 257 L129 349"/><path d="M220 258 L261 349"/><path d="M155 258 L129 429"/><path d="M245 255 L261 429"/>
    <path d="M560 257 L529 349"/><path d="M620 258 L661 349"/><path d="M555 258 L529 429"/><path d="M645 255 L661 429"/>
    <path d="M960 257 L920 349"/><path d="M1035 258 L1059 349"/><path d="M1000 260 L989 429"/>
  </g>

  <text x="600" y="530" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16">Configural → metric → scalar invariance evaluated across grade bands</text>
</svg>
