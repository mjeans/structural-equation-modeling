<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Structural model of support, engagement, confidence, and follow-up achievement</title>
  <desc id="desc">Support predicts engagement and confidence, engagement predicts confidence, and all three constructs predict follow-up achievement with baseline and grade-band covariates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="42" y="42" width="1116" height="546" rx="24" fill="#111f38" stroke="#334155"/>
  <text x="80" y="100" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">Latent student engagement model</text>
  <text x="80" y="137" fill="#94a3b8" font-family="Arial, sans-serif" font-size="19">Measurement quality first; structural associations second</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <ellipse cx="190" cy="300" rx="112" ry="58" fill="#1e3a5f" stroke="#60a5fa" stroke-width="3"/>
    <text x="190" y="308" fill="#dbeafe" font-size="23" font-weight="700">Support</text>

    <ellipse cx="485" cy="220" rx="120" ry="58" fill="#174631" stroke="#4ade80" stroke-width="3"/>
    <text x="485" y="228" fill="#dcfce7" font-size="23" font-weight="700">Engagement</text>

    <ellipse cx="755" cy="300" rx="132" ry="58" fill="#3b275a" stroke="#a78bfa" stroke-width="3"/>
    <text x="755" y="294" fill="#ede9fe" font-size="21" font-weight="700">Academic</text>
    <text x="755" y="321" fill="#ede9fe" font-size="21" font-weight="700">confidence</text>

    <rect x="965" y="244" width="155" height="112" rx="18" fill="#543b15" stroke="#fbbf24" stroke-width="3"/>
    <text x="1042" y="290" fill="#fef3c7" font-size="20" font-weight="700">Follow-up</text>
    <text x="1042" y="319" fill="#fef3c7" font-size="20" font-weight="700">achievement</text>

    <rect x="330" y="455" width="185" height="68" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="422" y="484" fill="#e2e8f0" font-size="17" font-weight="700">Baseline score</text>
    <text x="422" y="507" fill="#94a3b8" font-size="14">observed covariate</text>

    <rect x="645" y="455" width="185" height="68" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="737" y="484" fill="#e2e8f0" font-size="17" font-weight="700">Grade band</text>
    <text x="737" y="507" fill="#94a3b8" font-size="14">observed covariate</text>
  </g>

  <g fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)">
    <path d="M287 270 L370 239"/>
    <path d="M601 237 L650 270"/>
    <path d="M302 300 L620 300"/>
    <path d="M866 300 L963 300"/>
    <path d="M560 253 Q740 155 974 260"/>
    <path d="M292 330 Q630 430 976 345"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)">
    <path d="M422 454 L474 280"/>
    <path d="M470 455 L680 350"/>
    <path d="M510 480 Q780 540 1020 358"/>
    <path d="M700 454 L510 278"/>
    <path d="M740 454 L752 360"/>
    <path d="M830 478 Q980 460 1040 358"/>
  </g>

  <rect x="80" y="535" width="1040" height="32" rx="8" fill="#1e293b"/>
  <text x="600" y="557" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Robust ML • FIML missing-data handling • direct, specific indirect, serial indirect, and total associations</text>
</svg>
