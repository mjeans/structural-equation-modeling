name: Validate structural equation modeling project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
      - name: Install graphics system libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev
      - name: Restore versioned R environment
        run: Rscript scripts/restore_environment.R
      - name: Run end-to-end SEM workflow
        run: make all
      - name: Check required outputs
        run: |
          test -s outputs/cfa_fit_indices.csv
          test -s outputs/measurement_invariance.csv
          test -s outputs/sem_fit_indices.csv
          test -s outputs/structural_paths.csv
          test -s outputs/indirect_effects.csv
          test -s outputs/residual_variances.csv
